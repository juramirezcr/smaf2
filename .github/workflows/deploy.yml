name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy selected revision
        env:
          DEPLOY_PATH: ${{ secrets.SMAF_DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REVISION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" \
            bash -s -- "${DEPLOY_PATH}" "${REVISION}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          revision="$2"
          cd "$deploy_path"
          previous_sha="$(git rev-parse HEAD)"

          rollback() {
            echo "El despliegue falló; restaurando la revisión anterior (${previous_sha})." >&2
            git checkout --detach "$previous_sha"
            docker compose build
            docker compose up -d
          }
          trap rollback ERR

          git fetch --tags origin
          git checkout --detach "$revision"
          docker compose build
          docker compose run --rm app php artisan migrate --pretend
          docker compose up -d
          docker compose exec -T app php artisan migrate --force

          trap - ERR
          echo "Despliegue completado: ${revision}"
          REMOTE
