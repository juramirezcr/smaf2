services:
  app:
    build:
      context: .
      target: application
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage

  nginx:
    build:
      context: .
      target: nginx
    depends_on:
      - app
    ports:
      - "${SMAF_PORT:-8082}:80"
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage:ro

  queue:
    build:
      context: .
      target: application
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage

  scheduler:
    build:
      context: .
      target: application
    command: php artisan schedule:work
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  app-storage:
  mysql-data:
  redis-data:
